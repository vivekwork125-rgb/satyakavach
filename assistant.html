<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #0d0e12;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .container {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  h2 {
    margin-top: 0;
    font-size: 1.5rem;
    font-weight: 700;
  }
  .control-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 8px;
    color: #a1a1aa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    background: #18181b;
    color: #ffffff;
    border: 1px solid #3f3f46;
    font-size: 0.95rem;
    outline: none;
  }
  button {
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
    width: 100%;
  }
  button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  #display {
    margin-top: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    min-height: 50px;
    word-break: break-word;
    border-left: 3px solid #6366f1;
    text-align: left;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Speech Assistant</h2>

  <div class="control-group">
    <label for="langSelect">Select Language</label>
    <select id="langSelect">
      <option value="en-US" selected>English (US)</option>
      <option value="en-IN">English (India)</option>
      <option value="hi-IN">Hindi (हिन्दी)</option>
      <option value="es-ES">Spanish (Español)</option>
      <option value="fr-FR">French (Français)</option>
      <option value="de-DE">German (Deutsch)</option>
      <option value="zh-CN">Chinese (中文)</option>
      <option value="ja-JP">Japanese (日本語)</option>
      <option value="ar-SA">Arabic (العربية)</option>
      <option value="bn-IN">Bengali (বাংলা)</option>
      <option value="ta-IN">Tamil (தமிழ்)</option>
      <option value="te-IN">Telugu (తెలుగు)</option>
      <option value="mr-IN">Marathi (मराठी)</option>
      <option value="gu-IN">Gujarati (ગુજરાતી)</option>
      <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
      <option value="ml-IN">Malayalam (മലയാളം)</option>
      <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
      <option value="ru-RU">Russian (Русский)</option>
      <option value="pt-BR">Portuguese (Brasil)</option>
    </select>
  </div>

  <button id="trigger">Start Speaking</button>

  <div id="display">Select language and click Start...</div>
</div>

<script>
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = new SpeechRec();
const synth = window.speechSynthesis;
const triggerBtn = document.getElementById('trigger');
const displayDiv = document.getElementById('display');
const langSelect = document.getElementById('langSelect');

rec.interimResults = false;

triggerBtn.addEventListener('click', () => {
  rec.lang = langSelect.value;
  triggerBtn.textContent = 'Listening...';
  rec.start();
});

rec.onend = () => {
  triggerBtn.textContent = 'Start Speaking';
};

rec.onerror = (e) => {
  triggerBtn.textContent = 'Start Speaking';
  displayDiv.textContent = 'Error during recognition: ' + e.error;
};

rec.onresult = (e) => {
  const textInput = e.results[0][0].transcript;
  displayDiv.textContent = textInput;
  processData(textInput, langSelect.value);
};

function processData(input, lang) {
  const processedOutput = "I heard you say " + input;
  const utterance = new SpeechSynthesisUtterance(processedOutput);
  utterance.lang = lang;
  synth.speak(utterance);
}
</script>
</body>
</html>
